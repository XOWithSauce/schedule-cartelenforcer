name: Feature or Change Request
description: Suggest a new feature idea or a modification to a feature

body:
  - type: markdown
    attributes:
      value: |
        Please complete the fields below. **Note: Issues containing Links/URLs and/or File attachments will be discarded automatically.**

  - type: dropdown
    id: request-type
    attributes:
      label: What type of request is this?
      description: Select whether you are requesting a new feature or a change in existing features
      options:
        - "New Feature Request"
        - "Change Request"
    validations:
      required: true

  - type: input
    id: target-feature
    attributes:
      label: Feature Name / Target Name
      placeholder: "Feature X"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed Description
      description: "For Feature Requests: Describe what you want to happen, where, and under what conditions. For Change Requests: List the specific modifications you want to see applied to the feature."
      placeholder: "Provide a clear description of your request here..."
      render: text
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Add any other additional comments here (Optional)."
      placeholder: "Any extra context goes here..."
      render: text
    validations:
      required: false
